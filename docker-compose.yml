services:
  mariadb:
    image: mariadb:10.11
    container_name: amss-mariadb
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_PASSWORD:-amss}
      MARIADB_USER: ${MYSQL_USER:-amss}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-amss}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-amsscntc_cnt}
    volumes:
      - amss_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u ${MYSQL_USER:-amss} -p${MYSQL_PASSWORD:-amss}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amss_mariadb_data:
