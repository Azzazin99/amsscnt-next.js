services:
  postgres:
    image: postgres:16-alpine
    container_name: amss-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amss}
      POSTGRES_DB: ${POSTGRES_DB:-amss}
    volumes:
      - amss_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amss} -d ${POSTGRES_DB:-amss}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amss_pg_data:
